apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: glance

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: glance
      app.kubernetes.io/component: dashboard
      app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  - name: glance-config
    files:
      - config/glance.yml

# TODO: lets see if renovate catches this
images:
  - name: glanceapp/glance
    newTag: v0.8.7@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
