pages:
  - name: Home
    # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
    # hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: bookmarks
            groups:
              - links:
                  - title: Nekropolis K8s Logs
                    url: https://victoria-logs.nekropolis.irminsul/select/vmui/#/?g0.range_input=3h&g0.relative_time=last_3_hours&step=1m&query=error
                  - title: Nekropolis K8s Hubble
                    url: https://hubble.nekropolis.irminsul/
          - type: calendar
            first-day-of-week: monday

          - type: rss
            limit: 10
            collapse-after: 3
            cache: 12h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                limit: 4
              - url: https://ciechanow.ski/atom.xml
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau
              - url: https://samwho.dev/rss.xml
              - url: https://ishadeed.com/feed.xml
                title: Ahmad Shadeed

          #- type: twitch-channels
          #  channels:
          #    - theprimeagen
          #    - j_blow
          #    - giantwaffle
          #    - cohhcarnage
          #    - christitustech
          #    - EJ_SA

      - size: full
        widgets:
          - type: group
            widgets:
              - type: hacker-news
              - type: lobsters

          #- type: videos
          #  channels:
          #    - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
          #    - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
          #    - UCsBjURrPoezykLs9EqgamOA # Fireship
          #    - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
          #    - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium

          #- type: group
          #  widgets:
          #    - type: reddit
          #      subreddit: technology
          #      show-thumbnails: true
          #    - type: reddit
          #      subreddit: selfhosted
          #      show-thumbnails: true

      - size: small
        widgets:
          - type: weather
            location: Münster, Germany
            units: metric
            hour-format: 24h
            # Optionally hide the location from being displayed in the widget
            # hide-location: true

          #- type: markets
          #  markets:
          #    - symbol: SPY
          #      name: S&P 500
          #    - symbol: BTC-USD
          #      name: Bitcoin
          #    - symbol: NVDA
          #      name: NVIDIA
          #    - symbol: AAPL
          #      name: Apple
          #    - symbol: MSFT
          #      name: Microsoft

          - type: releases
            cache: 1d
            # Without authentication the Github API allows for up to 60 requests per hour. You can create a
            # read-only token from your Github account settings and use it here to increase the limit.
            # token: ...
            # TODO: add forgejo
            repositories:
              - glanceapp/glance
              - kubernetes/kubernetes
              - kubernetes-sigs/cluster-api

